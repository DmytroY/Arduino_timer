; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = 
    SPI
    Wire
    adafruit/RTClib @ ^2.1.3
    ;marcoschwartz/LiquidCrystal_I2C @ ^1.1.2
    LiquidCrystal

lib_ldf_mode = deep